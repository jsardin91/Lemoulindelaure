name: Audit preview Timetics discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Audit read-only booking state
        shell: bash
        run: |
          set -euo pipefail
          scp -q -i ~/.ssh/id_ed25519 -P "${{ secrets.SSH_PORT }}" scripts/audit-discovery-preview.php \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:.lmdl-discovery-audit-${GITHUB_RUN_ID}.php"
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash -s -- '${GITHUB_RUN_ID}'" <<'REMOTE'
          set -euo pipefail
          trap 'rm -f "$HOME/.lmdl-discovery-audit-$1.php"' EXIT
          listings="$(find "$HOME" -maxdepth 7 -type f -name wp-config.php -not -path '*/.trash/*' -not -path '*/.lmdl-preview-backups/*' 2>/dev/null)"
          configs=()
          if [ -n "$listings" ]; then mapfile -t configs <<< "$listings"; fi
          test "${#configs[@]}" -eq 1
          root="$(realpath "$(dirname "${configs[0]}")")"
          wp --path="$root" eval-file "$HOME/.lmdl-discovery-audit-$1.php"
          REMOTE
