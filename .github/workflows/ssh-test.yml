name: Test SSH Connection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ssh-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Test connection
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'printf "SSH_CONNECTION_OK\n"'

      - name: Verify a single WordPress installation and Astra
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          listings="$(find "$HOME" -maxdepth 7 -type f -name wp-config.php -not -path '*/.trash/*' 2>/dev/null)"
          configs=()
          if [ -n "$listings" ]; then
            mapfile -t configs <<< "$listings"
          fi
          if [ "${#configs[@]}" -ne 1 ]; then
            printf 'WORDPRESS_INSTALLATIONS=%s (expected exactly one; paths withheld)\n' "${#configs[@]}"
            exit 1
          fi
          root="$(dirname "${configs[0]}")"
          test -d "$root/wp-admin" && test -d "$root/wp-content/themes/astra" || {
            printf 'WORDPRESS_OR_ASTRA_MISSING\n'
            exit 1
          }
          printf 'WORDPRESS_AND_ASTRA_OK\n'
          if command -v wp >/dev/null 2>&1; then
            printf 'WP_CLI_AVAILABLE\n'
          else
            printf 'WP_CLI_UNAVAILABLE\n'
          fi
          REMOTE
